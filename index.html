Diferencial para una línea trifásica con neutro: abre los cuatro polos si detecta una fuga a tierra. Un clic hace la prueba o lo rearma. | Neutroa duen linea trifasiko baterako diferentziala: lau poloak irekitzen ditu lurrerako ihesa detektatzen badu. Klik batek proba egiten du edo berriro armatzen du. | Diferencial per a una línia trifàsica amb neutre: obre els quatre pols si detecta una fuita a terra. Un clic fa la prova o el rearma. | Diferencial para unha liña trifásica con neutro: abre os catro polos se detecta unha fuga a terra. Un clic fai a proba ou réarmao. | RCD for a three-phase line with neutral: opens all four poles if it detects an earth leakage. A click tests or resets it. | Différentiel pour une ligne triphasée avec neutre : ouvre les quatre pôles en cas de fuite à la terre. Un clic fait le test ou le réarme.
Dos en uno: corta por cortocircuito como un magnetotérmico y por fuga a tierra como un diferencial. Un clic lo abre o lo rearma. | Bi bat: zirkuitulaburragatik mozten du magnetotermiko bat bezala eta lurrerako ihesagatik diferentzial bat bezala. Klik batek irekitzen edo berriro armatzen du. | Dos en un: talla per curtcircuit com un magnetotèrmic i per fuita a terra com un diferencial. Un clic l’obre o el rearma. | Dous en un: corta por curtocircuíto como un magnetotérmico e por fuga a terra como un diferencial. Un clic ábreo ou réarmao. | Two in one: trips on short circuit like an MCB and on earth leakage like an RCD. A click opens or resets it. | Deux en un : coupe sur court-circuit comme un disjoncteur et sur fuite à la terre comme un différentiel. Un clic l’ouvre ou le réarme.

Sonda de suelo que cierra al mojarse. Se usa para cortar la electroválvula del agua. | Bustitzean ixten den lurzoruko sonda. Uraren solenoide-balbula mozteko erabiltzen da. | Sonda de terra que es tanca en mullar-se. S’usa per tallar l’electrovàlvula de l’aigua. | Sonda de chan que pecha ao mollarse. Úsase para cortar a electroválvula da auga. | Floor probe that closes when wet. Used to cut off the water solenoid valve. | Sonde de sol qui se ferme au contact de l’eau. Sert à couper l’électrovanne d’eau.
Limita la corriente: I = V / R. Imprescindible delante de un LED o en la base de un transistor. Si disipa más del doble de su potencia, se quema y abre el circuito. | Korrontea mugatzen du: I = V / R. Ezinbestekoa LED baten aurrean edo transistore baten basean. Bere potentziaren bikoitza baino gehiago xahutzen badu, erre egiten da eta zirkuitua irekitzen du. | Limita el corrent: I = V / R. Imprescindible davant d’un LED o a la base d’un transistor. Si dissipa més del doble de la seva potència, es crema i obre el circuit. | Limita a corrente: I = V / R. Imprescindible diante dun LED ou na base dun transistor. Se disipa máis do dobre da súa potencia, queimase e abre o circuíto. | Limits the current: I = V / R. Essential in front of an LED or at the base of a transistor. If it dissipates more than twice its rating, it burns out and opens the circuit. | Limite le courant : I = V / R. Indispensable devant une LED ou sur la base d’un transistor. S’il dissipe plus du double de sa puissance, il brûle et ouvre le circuit.
Deja pasar la corriente solo del ánodo (arriba) al cátodo (la raya). En paralelo con una bobina de continua, con el cátodo en el +, es el diodo de libre circulación que se come el pico de tensión al desconectarla. | Korrontea anodotik (goian) katodora (marrara) bakarrik uzten du pasatzen. Korronte zuzeneko bobina batekin paraleloan, katodoa +-an, deskonektatzean tentsio-gailurra irensten duen biraketa libreko diodoa da. | Deixa passar el corrent només de l’ànode (a dalt) al càtode (la ratlla). En paral·lel amb una bobina de contínua, amb el càtode al +, és el díode de lliure circulació que s’empassa el pic de tensió en desconnectar-la. | Deixa pasar a corrente só do ánodo (arriba) ao cátodo (a raia). En paralelo cunha bobina de continua, co cátodo no +, é o diodo de libre circulación que se come o pico de tensión ao desconectala. | Lets current pass only from anode (top) to cathode (the bar). In parallel with a DC coil, cathode to +, it is the freewheel diode that absorbs the voltage spike when switched off. | Ne laisse passer le courant que de l’anode (en haut) vers la cathode (la barre). En parallèle d’une bobine en continu, cathode au +, c’est la diode de roue libre qui absorbe la surtension à la coupure.
Luce cuando la corriente va del ánodo al cátodo y ronda los 10 a 20 mA. Necesita SIEMPRE una resistencia en serie: a 24 V, de 1 kΩ a 2,2 kΩ. Sin ella pasa demasiada corriente y se quema. | LED-a pizten da korrontea anodotik katodora doanean eta 10 eta 20 mA artean dabilenean. BETI behar du erresistentzia bat seriean: 24 V-tan, 1 kΩ-tik 2,2 kΩ-ra. Gabe, korronte gehiegi pasatzen da eta erre egiten da. | Llueix quan el corrent va de l’ànode al càtode i ronda els 10 a 20 mA. Necessita SEMPRE una resistència en sèrie: a 24 V, d’1 kΩ a 2,2 kΩ. Sense ella passa massa corrent i es crema. | Luce cando a corrente vai do ánodo ao cátodo e ronda os 10 a 20 mA. Necesita SEMPRE unha resistencia en serie: a 24 V, de 1 kΩ a 2,2 kΩ. Sen ela pasa demasiada corrente e queimase. | Lights when current flows from anode to cathode at about 10 to 20 mA. It ALWAYS needs a series resistor: at 24 V, 1 kΩ to 2.2 kΩ. Without one too much current flows and it burns out. | S’allume quand le courant va de l’anode à la cathode, autour de 10 à 20 mA. Il faut TOUJOURS une résistance en série : à 24 V, de 1 kΩ à 2,2 kΩ. Sans elle, trop de courant passe et elle grille.
Cuatro diodos que convierten alterna en continua: entra por los bornes ~ y sale por + y −. Sale aprox. 0,9 veces la tensión alterna; con un condensador de filtro entre + y −, cerca de 1,3 veces. | Lau diodo alternoa jarraitu bihurtzen dutenak: ~ bornetatik sartzen da eta + eta −-tik ateratzen da. Gutxi gorabehera korronte alternoaren tentsioaren 0,9 aldiz ateratzen da; + eta − artean iragazki-kondentsadore batekin, 1,3 aldiz ingurura. | Quatre díodes que converteixen alterna en contínua: entra pels borns ~ i surt per + i −. Surt aprox. 0,9 vegades la tensió alterna; amb un condensador de filtre entre + i −, prop d’1,3 vegades. | Catro diodos que converten alterna en continua: entra polos bornes ~ e sae por + e −. Sae aprox. 0,9 veces a tensión alterna; cun condensador de filtro entre + e −, preto de 1,3 veces. | Four diodes that turn AC into DC: it enters at the ~ terminals and leaves at + and −. Output is about 0.9 times the AC voltage; with a filter capacitor between + and −, about 1.3 times. | Quatre diodes qui convertissent l’alternatif en continu : entrée sur les bornes ~, sortie sur + et −. La sortie vaut environ 0,9 fois la tension alternative ; avec un condensateur de filtrage entre + et −, environ 1,3 fois.
En continua no deja pasar corriente: se carga y guarda energía. A la salida de un puente rectificador alisa la tensión (filtro) y la sube hasta casi el valor de pico. El + va arriba. | Korronte zuzenean ez du korronterik pasatzen uzten: kargatu egiten da eta energia gordetzen du. Zubi zuzentzaile baten irteeran tentsioa leuntzen du (iragazkia) eta gailur-baliora ia igotzen du. + goian doa. | En contínua no deixa passar corrent: es carrega i guarda energia. A la sortida d’un pont rectificador allisa la tensió (filtre) i la puja fins gairebé el valor de pic. El + va a dalt. | En continua non deixa pasar corrente: cárgase e garda enerxía. Á saída dunha ponte rectificadora alisa a tensión (filtro) e súbea case ata o valor de pico. O + vai arriba. | In DC it does not pass current: it charges and stores energy. At the output of a bridge rectifier it smooths the voltage (filter) and raises it almost to the peak value. The + goes on top. | En continu il ne laisse pas passer le courant : il se charge et stocke de l’énergie. À la sortie d’un pont redresseur il lisse la tension (filtre) et la monte presque à la valeur crête. Le + est en haut.
Interruptor electrónico: una corriente pequeña de base (B) a emisor (E) deja pasar una grande de colector (C) a emisor. La base va siempre con resistencia (unos 10 kΩ a 24 V). Aguanta hasta 0,5 A: para más, que mande un relé. | Etengailu elektronikoa: oinarri (B) eta igorle (E) arteko korronte txiki batek kolektore (C) eta igorle arteko handi bat uzten du pasatzen. Oinarria beti erresistentziarekin doa (24 V-tan 10 kΩ inguru). 0,5 A-ra arte jasaten du: gehiagorako, errele batek agindu dezala. | Interruptor electrònic: un corrent petit de base (B) a emissor (E) deixa passar un de gran de col·lector (C) a emissor. La base va sempre amb resistència (uns 10 kΩ a 24 V). Aguanta fins a 0,5 A: per a més, que mani un relé. | Interruptor electrónico: unha corrente pequena de base (B) a emisor (E) deixa pasar unha grande de colector (C) a emisor. A base vai sempre con resistencia (uns 10 kΩ a 24 V). Aguanta ata 0,5 A: para máis, que mande un relé. | Electronic switch: a small current from base (B) to emitter (E) lets a large one flow from collector (C) to emitter. The base always goes through a resistor (about 10 kΩ at 24 V). It handles up to 0.5 A: for more, let a relay do the switching. | Interrupteur électronique : un petit courant de base (B) à émetteur (E) laisse passer un grand courant de collecteur (C) à émetteur. La base passe toujours par une résistance (environ 10 kΩ à 24 V). Il supporte jusqu’à 0,5 A : au-delà, laissez un relais commander.

Busque un componente con Ctrl+K por su nombre o por lo que hace («luz», «paro», «bomba») o arrástrelo desde el cajón de la izquierda. | Bilatu osagai bat Ctrl+K-rekin bere izenaz edo egiten duenaz («argia», «gelditzea», «ponpa») edo arrastatu ezkerreko tiraderatik. | Cerqueu un component amb Ctrl+K pel seu nom o pel que fa («llum», «parada», «bomba») o arrossegueu-lo des del calaix de l’esquerra. | Busca un compoñente con Ctrl+K polo seu nome ou polo que fai («luz», «paro», «bomba») ou arrástrao desde o caixón da esquerda. | Find a component with Ctrl+K by its name or what it does (“light”, “stop”, “pump”) or drag it from the drawer on the left. | Cherchez un composant avec Ctrl+K par son nom ou sa fonction (« lampe », « arrêt », « pompe ») ou faites-le glisser depuis le tiroir de gauche.
Para cablear, pinche en un borne, arrastre y suelte en otro borne. El cable queda puesto y le pregunta qué conductor es; si llega a una alimentación, la respuesta viene marcada como sugerida (Intro la acepta). | Kableatzeko, egin klik bornean, arrastatu eta askatu beste borne batean. Kablea jarrita geratzen da eta zein eroale den galdetzen du; elikadura batera iristen bada, erantzuna iradoki gisa markatuta dator (Sartu-k onartzen du). | Per cablejar, cliqueu en un born, arrossegueu i deixeu anar en un altre born. El cable queda posat i us pregunta quin conductor és; si arriba a una alimentació, la resposta ve marcada com a suggerida (Retorn l’accepta). | Para cablear, preme nun borne, arrastra e solta noutro borne. O cable queda posto e pregúntache que condutor é; se chega a unha alimentación, a resposta vén marcada como suxerida (Intro acéptaa). | To wire, click a terminal, drag and drop onto another terminal. The wire stays in place and asks which conductor it is; if it reaches a supply, the answer comes pre-marked as suggested (Enter accepts it). | Pour câbler, cliquez sur une borne, faites glisser et déposez sur une autre borne. Le câble reste en place et demande quel conducteur il est ; s’il arrive sur une alimentation, la réponse est proposée (Entrée l’accepte).
Para cambiar el recorrido de un cable, arrastre cualquiera de sus tramos: los extremos y los cables que llegan a él siguen conectados. | Kable baten ibilbidea aldatzeko, arrastatu bere edozein zati: muturrak eta hara iristen diren kableak konektatuta jarraitzen dute. | Per canviar el recorregut d’un cable, arrossegueu qualsevol dels seus trams: els extrems i els cables que hi arriben segueixen connectats. | Para cambiar o percorrido dun cable, arrastra calquera dos seus treitos: os extremos e os cables que chegan a el seguen conectados. | To change a wire’s route, drag any of its segments: the ends and the wires reaching it stay connected. | Pour changer le tracé d’un câble, faites glisser l’un de ses tronçons : les extrémités et les câbles qui y arrivent restent connectés.
Para la potencia, el botón «3 cables» (o las teclas 2 a 5) tira varios a la vez: pinche en una fila de bornes y suelte en la otra. | Potentziarako, «3 cables» botoiak (edo 2tik 5erako teklek) hainbat kable aldi berean tiratzen ditu: egin klik borne-lerro batean eta askatu bestean. | Per a la potència, el botó «3 cables» (o les tecles 2 a 5) en tira diversos alhora: cliqueu en una fila de borns i deixeu anar a l’altra. | Para a potencia, o botón «3 cables» (ou as teclas 2 a 5) tira varios á vez: preme nunha fila de bornes e solta na outra. | For power, the “3 wires” button (or keys 2 to 5) draws several at once: click one row of terminals and drop on the other. | Pour la puissance, le bouton « 3 câbles » (ou les touches 2 à 5) en tire plusieurs à la fois : cliquez sur une rangée de bornes et déposez sur l’autre.
El botón Revisar cuenta lo que impediría que el circuito funcione: bornes al aire, contactos sin bobina, cables sueltos, cortocircuitos directos y colores cambiados. Un clic en cada aviso lleva hasta él. | Berrikusi botoiak zirkuituak ez funtzionatzea eragingo luketena zenbatzen du: borna askeak, bobinarik gabeko kontaktuak, kable solteak, zirkuitulabur zuzenak eta kolore aldatuak. Abisu bakoitzeko klik batek harengana eramaten du. | El botó Revisa compta el que impediria que el circuit funcioni: borns a l’aire, contactes sense bobina, cables solts, curtcircuits directes i colors canviats. Un clic a cada avís porta fins a ell. | O botón Revisar conta o que impediría que o circuíto funcione: bornes ao aire, contactos sen bobina, cables soltos, curtocircuítos directos e cores trocadas. Un clic en cada aviso leva ata el. | The Check button counts what would stop the circuit from working: loose terminals, contacts without a coil, loose wires, direct short circuits and swapped colours. A click on each warning takes you to it. | Le bouton Vérifier compte ce qui empêcherait le circuit de fonctionner : bornes libres, contacts sans bobine, câbles libres, courts-circuits directs et couleurs inversées. Un clic sur chaque avertissement y mène.
Pulse Simular y accione los pulsadores con el ratón. Si un cable tiene un color que no le toca, sale marcado en rojo. En el panel de la derecha se puede pausar o acelerar el tiempo (×2, ×5, ×10) para no esperar a temporizadores y cilindros. | Sakatu Simulatu eta eragin pultsagailuak saguarekin. Kable batek dagokiona ez den kolorea badu, gorriz markatuta ateratzen da. Eskuineko panelean denbora pausatu edo azkartu daiteke (×2, ×5, ×10) tenporizadoreen eta zilindroen zain ez egoteko. | Premeu Simula i accioneu els polsadors amb el ratolí. Si un cable té un color que no li toca, surt marcat en vermell. Al tauler de la dreta es pot pausar o accelerar el temps (×2, ×5, ×10) per no esperar temporitzadors i cilindres. | Preme Simular e acciona os pulsadores co rato. Se un cable ten unha cor que non lle toca, sae marcado en vermello. No panel da dereita pódese pausar ou acelerar o tempo (×2, ×5, ×10) para non esperar a temporizadores e cilindros. | Press Simulate and operate the pushbuttons with the mouse. A wire with the wrong colour is marked in red. In the right panel you can pause or speed up time (×2, ×5, ×10) so you do not wait for timers and cylinders. | Cliquez sur Simuler et actionnez les boutons à la souris. Un câble de mauvaise couleur est marqué en rouge. Dans le panneau de droite on peut mettre en pause ou accélérer le temps (×2, ×5, ×10) pour ne pas attendre les temporisations et les vérins.
Abajo a la izquierda están las hojas del plano: + añade una, doble clic cambia el nombre y × la borra. | Behean ezkerrean daude planoaren orriak: + batek bat gehitzen du, klik bikoitzak izena aldatzen du eta × batek ezabatzen du. | A baix a l’esquerra hi ha els fulls del plànol: + n’afegeix un, doble clic canvia el nom i × l’esborra. | Abaixo á esquerda están as follas do plano: + engade unha, dobre clic cambia o nome e × bórraa. | Bottom left are the drawing sheets: + adds one, double-click renames it and × deletes it. | En bas à gauche se trouvent les feuilles du plan : + en ajoute une, un double-clic la renomme et × la supprime.
Para unir un punto de una hoja con otro de otra hoja, ponga en cada una un «Conector de hoja» con la misma marca (por ejemplo L). Doble clic sobre él salta a su pareja. | Orri bateko puntu bat beste orri bateko beste batekin lotzeko, jarri bakoitzean «Conector de hoja» bat marka berarekin (adibidez L). Haren gaineko klik bikoitzak bere bikotera jauzi egiten du. | Per unir un punt d’un full amb un altre d’un altre full, poseu a cadascun un «Connector de full» amb la mateixa marca (per exemple L). Doble clic al damunt salta a la seva parella. | Para unir un punto dunha folla con outro doutra folla, pon en cada unha un «Conector de folla» coa mesma marca (por exemplo L). Dobre clic sobre el salta á súa parella. | To join a point on one sheet with one on another, place a “Sheet connector” with the same tag on each (for example L). Double-clicking it jumps to its pair. | Pour relier un point d’une feuille à un autre d’une autre feuille, placez sur chacune un « Connecteur de feuille » de même repère (par exemple L). Un double-clic dessus saute à son pendant.

Cada salida Q es un contacto de relé: cablee el común y la bobina o la lámpara en serie con sus dos bornes. | Q irteera bakoitza errele-kontaktu bat da: kableatu komuna eta bobina edo lanpara seriean bere bi borneekin. | Cada sortida Q és un contacte de relé: cableu el comú i la bobina o la làmpada en sèrie amb els seus dos borns. | Cada saída Q é un contacto de relé: cablea o común e a bobina ou a lámpada en serie cos seus dous bornes. | Each output Q is a relay contact: wire the common and the coil or lamp in series with its two terminals. | Chaque sortie Q est un contact de relais : câblez le commun et la bobine ou la lampe en série avec ses deux bornes.
Doble clic sobre el PLC (o «Editar programa») abre el programa en contactos: columnas en serie (Y) con contactos en paralelo (O) y una salida por segmento: bobina, Set, Reset, temporizadores TON y TOF y contador. | PLCaren gaineko klik bikoitzak («Editar programa») programa kontaktuetan irekitzen du: zutabe seriean (ETA) kontaktu paraleloekin (EDO) eta irteera bat segmentuko: bobina, Set, Reset, TON eta TOF tenporizadoreak eta kontagailua. | Doble clic sobre el PLC («Editar programa») obre el programa en contactes: columnes en sèrie (I) amb contactes en paral·lel (O) i una sortida per segment: bobina, Set, Reset, temporitzadors TON i TOF i comptador. | Dobre clic sobre o PLC («Editar programa») abre o programa en contactos: columnas en serie (E) con contactos en paralelo (OU) e unha saída por segmento: bobina, Set, Reset, temporizadores TON e TOF e contador. | Double-clicking the PLC (“Edit program”) opens the ladder program: series columns (AND) with parallel contacts (OR) and one output per rung: coil, Set, Reset, TON and TOF timers and counter. | Un double-clic sur l’automate (« Modifier le programme ») ouvre le programme à contacts : colonnes en série (ET) avec contacts en parallèle (OU) et une sortie par segment : bobine, Set, Reset, temporisations TON et TOF et compteur.

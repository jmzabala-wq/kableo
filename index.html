<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kableo: editor y simulador de esquemas eléctricos, de vivienda, neumáticos, electrónicos y de PLC para aprender automatismos.">
<meta name="theme-color" content="#14201D">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%227%22%20fill%3D%22%23F2B705%22%2F%3E%3Cpath%20d%3D%22M9.6%2022H13c3.2%200%203-12%206.2-12h3.2%22%20fill%3D%22none%22%20stroke%3D%22%2314201D%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%227%22%20cy%3D%2222%22%20r%3D%222.7%22%20fill%3D%22%2314201D%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2210%22%20r%3D%222.7%22%20fill%3D%22%2314201D%22%2F%3E%3C%2Fsvg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<title>Kableo</title>
<meta property="og:title" content="Kableo">
<meta property="og:description" content="Kableo: editor y simulador de esquemas eléctricos, de vivienda, neumáticos, electrónicos y de PLC para aprender automatismos.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Distribución: barra de herramientas arriba · cajón de componentes a la izquierda ·
   pestañas de planos + hoja de dibujo (papel de plano, igual en los dos temas) al centro ·
   propiedades y estado a la derecha */
:root{
  --chrome:#E6EAE8; --panel:#F6F8F7; --raise:#FFFFFF; --line:#D2D9D6; --line2:#E3E8E6;
  --text:#14201D; --muted:#56635F; --faint:#86918D;
  --sheet:#EEF2F0; --gdot:#B9C4C0; --gmaj:#8F9E99; --ink:#1A2724; --inkdim:rgba(26,39,36,.36); --inkmid:#4A5754;
  --sel:#2A62D6; --selfill:rgba(42,98,214,.08);
  --accent:#F2B705; --accent-2:#B98C00; --accent-ink:#1D1600;
  --stop:#C9342A; --ok:#177A41; --warn:#9A5B00; --err:#C9342A;
  --onfill:#FFD54A;
  --l1:#8A4A22; --l2:#1B1B1B; --l3:#8B939A; --n:#2462C8; --pe:#4E9C2C; --mix:#8B6AB6; --dc:#D0342C; --sec:#E07A10;
  --chip-on:#DCF0E3; --chip-on-t:#13683A; --chip-al:#FAE0DC; --chip-al-t:#A3241A;
  --chip-w:#FBEBC8; --chip-w-t:#7F4C00; --chip-off:#E8ECEA; --chip-off-t:#56635F;
  --shadow:0 10px 30px rgba(20,32,29,.16),0 2px 6px rgba(20,32,29,.08);
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --f-disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#0E1211; --panel:#141918; --raise:#1B2220; --line:#29322F; --line2:#212927;
  --text:#DFE6E3; --muted:#97A3A0; --faint:#6B7773;
  --sheet:#CCD4D0; --gdot:#9AA7A2; --gmaj:#7C8B86; --selfill:rgba(42,98,214,.13);
  --chip-on:#15331F; --chip-on-t:#82DBA6; --chip-al:#3B1613; --chip-al-t:#FF9F95;
  --chip-w:#382A0B; --chip-w-t:#F4C46E; --chip-off:#202826; --chip-off-t:#97A3A0;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#0E1211; --panel:#141918; --raise:#1B2220; --line:#29322F; --line2:#212927;
  --text:#DFE6E3; --muted:#97A3A0; --faint:#6B7773;
  --sheet:#CCD4D0; --gdot:#9AA7A2; --gmaj:#7C8B86; --selfill:rgba(42,98,214,.13);
  --chip-on:#15331F; --chip-on-t:#82DBA6; --chip-al:#3B1613; --chip-al-t:#FF9F95;
  --chip-w:#382A0B; --chip-w-t:#F4C46E; --chip-off:#202826; --chip-off-t:#97A3A0;
  --shadow:0 12px 34px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}

/* Lo oculto se queda oculto aunque una regla de la página diga display:flex (el buscador y el inicio lo necesitan) */
[hidden],.modal[hidden],.home[hidden],.menu[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--chrome);color:var(--text);font:14px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:232px minmax(0,1fr) 300px;
  grid-template-areas:"bar bar bar" "pal stage insp"}

/* ---- barra ---- */
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
.bar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding-right:6px;flex:none}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font:700 19px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.brand span{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--muted);margin-top:3px}
.grp{display:flex;gap:4px;padding-left:10px;border-left:1px solid var(--line);flex:none;align-items:center}
.btn{height:34px;padding:0 11px;border:1px solid var(--line);background:var(--raise);border-radius:7px;display:inline-flex;gap:7px;align-items:center;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.ib{width:34px;padding:0;justify-content:center}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:var(--text);color:var(--panel);border-color:var(--text)}
.btn.danger{color:var(--err)}
.btn.sm{height:30px;font-size:12.5px;padding:0 9px}
.wsw{width:34px;padding:0;justify-content:center}
.wsw i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid var(--raise)}
.find{width:210px;justify-content:space-between;color:var(--muted)}
.rvb{position:relative}
.rvb.ok svg{stroke:var(--ok)}
.bdg{min-width:18px;height:18px;border-radius:9px;padding:0 5px;font:700 11px/18px var(--f-ui);text-align:center;background:var(--accent);color:var(--accent-ink)}
.rvb.bad .bdg{background:var(--err);color:#fff}
.menu button.mi.rv{align-items:flex-start;justify-content:flex-start;gap:10px;text-align:left}
.menu .rv::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.menu .rv.err::before{background:var(--err)}
.menu .rv.info::before{background:var(--faint)}
.menu .rv b{font-weight:500;font-size:13px;line-height:1.35}
.rvok,.rvnote{margin:4px 11px 8px;font-size:12.5px;color:var(--muted);max-width:340px}
.rvnote{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.find kbd{font-size:10.5px}
.sp{flex:1 0 8px}
.run{height:38px;padding:0 18px 0 12px;border-radius:19px;background:var(--accent);border:1px solid var(--accent-2);color:var(--accent-ink);
  font:700 16px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;cursor:pointer;flex:none;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.4) inset}
.run i{width:13px;height:13px;border-radius:50%;background:var(--accent-ink);display:block;position:relative}
.run i::after{content:"";position:absolute;left:4.5px;top:3px;border-left:6px solid var(--accent);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.live .run{background:var(--stop);border-color:#8E2119;color:#fff}
.live .run i{background:#fff;animation:pulso 1.1s ease-in-out infinite}
.live .run i::after{left:3.5px;top:3.5px;width:6px;height:6px;border:0;background:var(--stop)}
@keyframes pulso{50%{box-shadow:0 0 0 5px rgba(255,255,255,.18)}}
.menu{position:fixed;z-index:60;min-width:270px;max-height:calc(100% - 80px);overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.menu button.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:none;padding:8px 11px;border-radius:7px;cursor:pointer}
.menu button.mi:hover,.menu button.mi:focus-visible{background:var(--chrome)}
.menu b{display:block;font-weight:600;font-size:13.5px}
.menu small{display:block;color:var(--muted);font-size:12px}
.menu kbd{flex:none}
.fmenu{max-height:calc(100vh - 90px);overflow:auto}
.menu button.mi.mf{padding:6px 11px}
.menu .mf b{font-weight:500;font-size:13.5px}
.fmenu hr{margin:4px}
.fmenu h5{margin:6px 11px 3px}
.xrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 8px 6px}
.xb{height:30px;border:1px solid var(--line);background:var(--raise);border-radius:7px;cursor:pointer;font:600 11.5px var(--f-mono);color:var(--text)}
.xb:hover{border-color:var(--sel);background:var(--selfill)}
.saveas .fld{margin:4px 10px 10px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu h5{margin:8px 11px 4px;font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.swg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 8px 8px}
.chip{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raise);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chip i{width:20px;height:20px;border-radius:50%;display:block}
.chip.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--selfill)}
.seg{display:flex;gap:4px}
.seg button{flex:1;height:32px;border:1px solid var(--line);background:var(--raise);border-radius:7px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{border-color:var(--sel);background:var(--selfill)}
.seg i{display:block;width:22px;border-radius:2px;background:var(--text)}

/* ---- cajón de componentes ---- */
.pal{grid-area:pal;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 12px 28px;min-height:0}
.search{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--raise);padding:0 10px;margin-bottom:6px}
.pc h3{margin:10px 0 4px;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pc.rec h3{margin:12px 2px 6px}
.pch{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:7px;width:100%;padding:7px 4px;border-radius:6px;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit}
.pch:hover{background:var(--raise);color:var(--text)}
.pch:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.pch svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;flex:none}
.pch span{flex:1}
.pch em{font-style:normal;font-weight:500;letter-spacing:0;color:var(--faint)}
.pc.closed .pch svg{transform:rotate(-90deg)}
.pc.closed .pgrid{display:none}
#pal-list.searching .pc.closed .pgrid{display:grid}
#pal-list.searching .pc.rec{display:none}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.it{border:1px solid transparent;background:none;border-radius:8px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;min-width:0;touch-action:none}
.it:hover{background:var(--raise);border-color:var(--line)}
.it.on{background:var(--selfill);border-color:var(--sel)}
.it .ic{width:100%;height:36px;display:flex;align-items:center;justify-content:center;background:var(--sheet);border-radius:5px}
.it .ic svg{width:80%;height:30px}
.it .nm{font-size:10.5px;line-height:1.15;text-align:center;color:var(--text);overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.live .pal{opacity:.4;pointer-events:none}

/* ---- pestañas + hoja ---- */
.stage{grid-area:stage;display:grid;grid-template-rows:38px minmax(0,1fr);min-width:0;min-height:0;background:var(--sheet)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;min-width:0}
.tab{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;max-width:230px;flex:none;color:var(--muted);font-size:12.5px;font-weight:500}
.tab:hover{background:var(--panel)}
.tab.on{background:var(--sheet);border-color:var(--line);color:#14201D;margin-bottom:-1px;height:33px}
.tab .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tab input{width:150px;height:24px;border:1px solid var(--sel);border-radius:5px;background:var(--raise);color:var(--text);padding:0 6px;font-size:12.5px}
.tab .tx{width:22px;height:22px;border:0;background:none;border-radius:5px;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;flex:none}
.tab .tx:hover{background:var(--chrome);color:var(--text)}
.tadd{width:28px;height:28px;margin:0 0 3px 4px;border:1px dashed var(--line);background:none;border-radius:7px;cursor:pointer;color:var(--muted);font-size:17px;flex:none}
.tadd:hover{border-color:var(--faint);color:var(--text)}
.sst{margin:0 4px 9px auto;padding-left:12px;font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;flex:none}
.sst.cloud::before{content:"● ";color:var(--ok)}
.sst.local::before{content:"● ";color:var(--accent-2)}
.sst.fail::before{content:"● ";color:var(--err)}
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden}
#sv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.tool-wire #sv{cursor:crosshair}
.tool-place #sv{cursor:copy}
.tool-text #sv{cursor:text}
.tool-select #sv{cursor:grab}
.tool-select.panning #sv{cursor:grabbing}
.tool-select .cp,.tool-select .whit{cursor:move}
.tool-box #sv{cursor:crosshair}
.tool-box .cp,.tool-box .whit{cursor:move}
.mbox{pointer-events:none}
.cp .dim{stroke-dasharray:2 3;stroke-width:1.4;opacity:.45}
.txed{position:absolute;z-index:6}
.txed textarea{display:block;width:100%;height:100%;box-sizing:border-box;border:1.5px dashed var(--sel);border-radius:4px;background:rgba(255,255,255,.92);padding:1px 4px;margin:0;resize:none;overflow:hidden;white-space:pre;outline:0;font-family:var(--f-ui)}
.txbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.txed .txbar{position:absolute;left:0;bottom:calc(100% + 6px);flex-wrap:nowrap;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow);width:max-content}
.txed.low .txbar{bottom:auto;top:calc(100% + 6px)}
.txbar button{min-width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--text);cursor:pointer;font:600 13px var(--f-ui);display:flex;align-items:center;justify-content:center;padding:0 5px}
.txbar button:hover{background:var(--chrome)}
.txbar button.on{background:var(--selfill);box-shadow:inset 0 0 0 1px var(--sel)}
.txbar .sz{font:500 12px var(--f-mono);min-width:26px;text-align:center;color:var(--muted)}
.txbar .sp{width:1px;height:18px;background:var(--line);margin:0 3px}
.txbar i.dot{display:block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(150,150,150,.6)}
.txbar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fld textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:7px;background:var(--raise);color:var(--text);padding:6px 8px;font:inherit;font-size:13px}
.panning #sv{cursor:grabbing}
.gdot{fill:var(--gdot)} .gmaj{fill:var(--gmaj)}
.cp line,.cp path,.cp rect,.cp circle{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cp .hit{fill:transparent;stroke:none}
.cp .dash{stroke-dasharray:4 4;stroke-width:1.5}
.cp .fill{fill:var(--ink)}
.cp .on{fill:var(--onfill)}
.cp .warn{stroke:var(--err)}
.cp .trip{fill:rgba(201,52,42,.13);stroke:var(--err)}
.cp .trk{fill:rgba(26,39,36,.14);stroke:none}
.cp .prg{fill:var(--ink);stroke:none}
.cp .glow{stroke:none}
.cp .mrun{fill:rgba(23,122,65,.1)}
.cp .rot{stroke-dasharray:7 6;stroke-width:2.4}
.cp .buzz{stroke:var(--err);stroke-dasharray:3 4;stroke-width:1.6}
.cp .sw{stroke:none}
.cp .mush{fill:#D0342C}
.cp .wave{stroke:var(--err);stroke-width:1.6}
.cp .rod{stroke-width:5}
.cp .piston{fill:var(--ink)}
.cp .act{fill:rgba(201,52,42,.16);stroke:var(--err)}
.cp .term{fill:var(--sheet)}
.sw-l1{fill:var(--l1)} .sw-l2{fill:var(--l2)} .sw-l3{fill:var(--l3)} .sw-n{fill:var(--n)} .sw-pe{fill:var(--pe)} .sw-dc{fill:var(--dc)}
.cp text,.wl{fill:var(--ink);stroke:none}
.tg{font:600 12px var(--f-mono)}
.tn{font:500 9.5px var(--f-mono);fill:var(--inkmid)!important}
.xrefm{font:500 8.5px var(--f-mono);fill:var(--muted)!important}
.gl{font:600 11px var(--f-ui)}
.hd{font:600 9.5px var(--f-mono);letter-spacing:.06em}
.pl{font:600 10.5px var(--f-mono)}
.mt{font:600 17px var(--f-ui)}
.ms{font:500 11px var(--f-mono)}
.note{font:500 14px var(--f-ui)}
.wl{font:600 10px var(--f-mono)}
.st{font:600 11px var(--f-ui)}
.st.ok{fill:var(--ok)!important} .st.err{fill:var(--err)!important} .st.warn{fill:var(--warn)!important}
.cp.ghost{opacity:.5;pointer-events:none}
.live .cp.ia .hit{cursor:pointer}
/* El trazo visible no recoge el ratón: lo hace .whit, más ancho y debajo. Si el trazo lo recogía, pinchar
   justo encima del cable no lo seleccionaba (el trazo no lleva data-id) y se movía el plano en su lugar. */
.wire{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.wire.thick{stroke-width:3.4}
.wire.peo{stroke:#E9C81C;stroke-dasharray:9 9}
.whit{fill:none;stroke:transparent;stroke-width:12}
.live .whit{pointer-events:none}
.wire.sel{stroke:var(--sel)!important;stroke-width:3.4}
.wire.w-l1{stroke:var(--l1);stroke-width:3} .wire.w-l2{stroke:var(--l2);stroke-width:3} .wire.w-l3{stroke:var(--l3);stroke-width:3}
.wire.w-n{stroke:var(--n);stroke-width:3} .wire.w-pe{stroke:var(--pe);stroke-width:3;stroke-dasharray:12 7}
.wire.w-dc{stroke:var(--dc);stroke-width:3} .wire.w-sec{stroke:var(--sec);stroke-width:3}
.wire.w-mix{stroke:var(--mix);stroke-width:2.6} .wire.w-dead{stroke:var(--inkdim)} .wire.w-err{stroke:var(--err);stroke-width:4.5}
.wire.w-off{opacity:.32}
.jn{fill:var(--ink)} .jn.w-l1{fill:var(--l1)} .jn.w-l2{fill:var(--l2)} .jn.w-l3{fill:var(--l3)} .jn.w-n{fill:var(--n)} .jn.w-pe{fill:var(--pe)} .jn.w-dc{fill:var(--dc)} .jn.w-sec{fill:var(--sec)} .jn.w-mix{fill:var(--mix)} .jn.w-dead{fill:var(--inkdim)} .jn.w-err{fill:var(--err)}
.selbox{fill:var(--selfill);stroke:var(--sel);stroke-width:1.2;stroke-dasharray:5 4}
.mbox{fill:var(--selfill);stroke:var(--sel);stroke-width:1}
.draft{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:6 5}
.pinfree{fill:var(--sheet);stroke:var(--sel);stroke-width:1.3;pointer-events:none}
.jn,.wl,.flash,.selbox,.draft,.hov,.wbad{pointer-events:none}
.live .pinfree{display:none}
.hov{fill:none;stroke:var(--sel);stroke-width:1.5}
.hov.ok{stroke:var(--ok);fill:rgba(23,122,65,.16);stroke-width:2}
.flash{fill:none;stroke:var(--sel);stroke-width:3;animation:flash 1.4s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

.legend{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);border:1px solid rgba(26,39,36,.14);border-radius:999px;padding:3px 9px 3px 6px;font:500 11px var(--f-mono);color:#1A2724}
.legend i{width:16px;height:4px;border-radius:2px;display:block}
.banner{position:absolute;left:50%;top:48px;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));background:var(--stop);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);text-align:center}
.banner.warn{background:#8A5200}
.hint.fade{opacity:0;transition:opacity .6s}
.hint{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 260px);font-size:12px;color:#33413D;background:rgba(255,255,255,.78);border:1px solid rgba(26,39,36,.12);border-radius:8px;padding:6px 10px;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zoom button{height:28px;min-width:28px;border:0;background:none;border-radius:6px;cursor:pointer;font-weight:600;padding:0 8px}
.zoom button:hover{background:var(--chrome)}
.zoom span{font:500 11.5px var(--f-mono);min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 24px);text-align:center;pointer-events:none;z-index:5}
.toast.err{background:var(--stop);color:#fff}

/* ---- panel derecho ---- */
.insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.insp-tog{display:none}
#ib{padding:16px 16px 28px}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ph .pic{width:54px;height:48px;border-radius:8px;background:var(--sheet);display:flex;align-items:center;justify-content:center;flex:none}
.ph .pic svg{width:44px;height:38px}
.ty{font:700 20px/1.05 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.cat{font:500 11px var(--f-mono);color:var(--muted);margin-top:3px;letter-spacing:.04em}
.desc{color:var(--muted);font-size:13px;margin:0 0 14px;text-wrap:pretty}
.fld{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.fld>span{font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--raise);padding:0 10px;width:100%;min-width:0}
.fld input.tag{font:600 15px var(--f-mono);letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;cursor:pointer}
.link{font-size:12.5px;border-radius:8px;padding:8px 10px;margin:-2px 0 14px;background:var(--chip-on);color:var(--chip-on-t)}
.link.no{background:var(--chip-w);color:var(--chip-w-t)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.terms{font:500 11.5px var(--f-mono);color:var(--muted)}
h4{margin:20px 0 8px;font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--panel);font:600 11px/22px var(--f-mono);text-align:center}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px;align-items:center}
kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--raise);white-space:nowrap;justify-self:start;color:var(--text)}
.leg{display:grid;gap:6px;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:26px;height:5px;border-radius:3px;display:block;flex:none}
.stats{font:500 12px var(--f-mono);color:var(--muted)}
.dev{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.dev .dt{font:600 13px var(--f-mono)}
.dev .dn{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:600 11px/1 var(--f-ui);padding:5px 8px;border-radius:999px;background:var(--chip-off);color:var(--chip-off-t);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.on{background:var(--chip-on);color:var(--chip-on-t)}
.pill.al{background:var(--chip-al);color:var(--chip-al-t)}
.pill.wa{background:var(--chip-w);color:var(--chip-w-t)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:12.5px}
.log li{display:grid;grid-template-columns:50px 1fr;gap:6px;padding:3px 0}
.log time{font:500 11px/1.6 var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.log li.err{color:var(--err)}
.empty{color:var(--muted);font-size:12.5px}

/* ---- diálogos ---- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,14,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal.top{align-items:flex-start;padding-top:10vh}
.dlg{width:min(600px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dlg header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header .sst{margin:0 0 0 auto}
.dlg h2{margin:0;font:700 22px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.dlg .body{overflow:auto;padding:12px 16px 16px}
.dlg footer{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.dlg input.q{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 12px;margin-bottom:10px}
.files{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.files li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--raise)}
.files .fn{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fm{font:500 11px var(--f-mono);color:var(--muted)}
.files .fa{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.x{width:32px;height:32px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;border-radius:7px;color:var(--muted);flex:none}
.x:hover{background:var(--chrome)}
.cmd{width:min(620px,100%)}
.cmd .qwrap{padding:12px 12px 0}
.cmd .res{overflow:auto;padding:4px 8px 10px;max-height:58vh}
.cmd .gh{margin:10px 8px 4px;font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ci{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.ci.on{background:var(--selfill);box-shadow:inset 0 0 0 1px var(--sel)}
.ci .cic{width:30px;height:26px;border-radius:5px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);color:#1A2724}
.ci .cic svg{width:26px;height:22px}
.ci b{font-weight:600;font-size:13.5px}
.ci small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .k{font:500 10.5px var(--f-mono);color:var(--faint)}

/* ---- inicio, como la entrada de Word: carril de secciones + plantillas + recientes ---- */
.home{position:fixed;inset:0;z-index:70;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--panel)}
.hrail{background:#14201D;color:#E6ECE9;display:flex;flex-direction:column;gap:2px;padding:18px 12px 16px;min-height:0;overflow-y:auto}
.hbrand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.hbrand svg{width:34px;height:34px;flex:none}
.hbrand b{font:700 18px/1.05 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:#fff}
.hnav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border:0;border-radius:8px;background:none;color:#C9D3CF;font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative;flex:none}
.hnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hnav:hover{background:rgba(255,255,255,.07);color:#fff}
.hnav.on{background:rgba(242,183,5,.14);color:#fff}
.hnav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:#F2B705}
.hsp{flex:1}
.hcloud{border-top:1px solid rgba(255,255,255,.12);margin-top:8px;padding:12px 8px 10px;display:grid;gap:8px}
.hcloud .sst{margin:0;padding:0;color:#C9D3CF;white-space:normal}
.hcloud .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28);height:32px;font-size:12.5px;justify-content:center;white-space:normal;line-height:1.2}
.hmain{overflow-y:auto;min-height:0;padding-block:40px 56px;padding-left:max(16px,4vw);padding-right:max(16px,4vw)}
.hwrap{max-width:1080px;margin:0 auto}
.hmain h1{margin:0 0 8px;font:700 36px/1.05 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.hmain h2{margin:30px 0 12px;font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:18px}
.tpl{display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--text);min-width:0}
.tpl .th{aspect-ratio:4/3;width:100%;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--sheet);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color .15s,box-shadow .15s,transform .15s}
.tpl:hover .th,.tpl:focus-visible .th{border-color:var(--sel);box-shadow:0 0 0 3px var(--selfill);transform:translateY(-2px)}
.tpl .th svg{width:94%;height:94%}
.th svg *,.fth svg *{vector-effect:non-scaling-stroke;stroke-width:1.3px}
.th svg .wire.thick,.fth svg .wire.thick{stroke-width:2px}
.th svg text,.fth svg text,.th svg .pinfree,.fth svg .pinfree{display:none}
.tpl b{font-size:13.5px;font-weight:600;margin-top:2px}
.tpl small{font-size:12px;color:var(--muted);line-height:1.35}
.blank .th span{width:54px;height:54px;border-radius:50%;background:#14201D;color:#F2B705;display:flex;align-items:center;justify-content:center;font:300 34px/1 var(--f-ui)}
.hsearch{height:34px;width:min(300px,100%);border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 12px;font:400 13px var(--f-ui);letter-spacing:0;text-transform:none;color:var(--text)}
.frows{display:grid;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:58px minmax(0,1fr) 140px 120px auto;gap:14px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line2)}
.frow:hover{background:var(--raise)}
.fth{width:58px;height:44px;border-radius:6px;background:var(--sheet);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fth svg{width:100%;height:100%}
.fnm{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;color:var(--text)}
.fnm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnm small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:2px}
.fnm:hover b{text-decoration:underline}
.fdt,.fct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fact{display:flex;gap:4px;opacity:0}
.frow:hover .fact,.frow:focus-within .fact{opacity:1}
@media (hover:none){.fact{opacity:1}}
.hempty{padding:28px 6px;color:var(--muted);font-size:13px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:18px 0 12px}
.drop.over{border-color:var(--sel);background:var(--selfill)}
.hstore{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hstore .sst{margin:0;padding:0}

/* ---- cosas nuevas del plano ---- */
.cp .ptc{stroke:var(--ink);stroke-width:1.5}
.cp .hot{fill:rgba(240,120,20,.35);stroke:#D9480F}
.cp .plcb{fill:rgba(255,255,255,.42)}
.cp .plcs{fill:#DCE3E0}
.cp .plcs.run{fill:#D4EEDC}
.cp .plcs.bad{fill:#F6DAD6}
.cp .led{fill:var(--sheet);stroke-width:1.5}
.cp .led.lon{fill:#2FBF5B;stroke:#177A41}
.cp .tube{fill:rgba(255,255,255,.5)}
.cp .tube.lit{fill:#FFF6C8;stroke:#B98C00}
.cp .tglow{fill:#FFE27A;stroke:none;opacity:.45}
.cp .disp{fill:#DCE3E0}
.cp .dfill{fill:var(--ink)}
.cp .burnt{stroke:var(--err)!important}
.cp .rbody.hotr{fill:rgba(240,120,20,.3)}
.cp .airp{stroke:#0E8FB3!important;stroke-width:3.2!important}
.cp .vsq{fill:rgba(255,255,255,.55)}
.cp .vsq.cur{fill:#fff}
.cp .air-src{fill:rgba(14,143,179,.12)}
.cp .ah{fill:var(--ink);stroke:none}
.wire.w-air{stroke:#0E8FB3;stroke-width:3.2} .jn.w-air{fill:#0E8FB3}
/* ---- programa del PLC (bandeja inferior de la hoja) ---- */
.plcd{position:absolute;left:0;right:0;bottom:0;height:min(330px,56%);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,32,29,.12);z-index:5}
.canvas.plc-open .zoom,.canvas.plc-open .hint{bottom:calc(min(330px,56%) + 12px)}
.sheets{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:3px;max-width:calc(100% - 260px);overflow-x:auto;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08);scrollbar-width:thin}
.sheets .sh{height:28px;border:0;background:none;border-radius:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.sheets .sh:hover{background:var(--chrome);color:var(--text)}
.sheets .sh.on{background:var(--text);color:var(--panel)}
.sheets .sh .shx{font-size:15px;line-height:1;opacity:.6;padding:0 2px;border-radius:4px}
.sheets .sh .shx:hover{opacity:1;background:rgba(127,127,127,.25)}
.sheets .sh.conf{background:var(--chip-al);color:var(--chip-al-t)}
.sheets .sh.add{font-size:16px;padding:0 9px}
.sheets input{width:120px;height:26px;border:1px solid var(--sel);border-radius:5px;background:var(--raise);color:var(--text);padding:0 6px;font-size:12.5px}
.hint{bottom:58px!important}
.canvas.plc-open .sheets{bottom:calc(min(330px,56%) + 12px)}
.canvas.plc-open .hint{bottom:calc(min(330px,56%) + 58px)!important}
@media (max-width:760px){.sheets{max-width:calc(100% - 24px);bottom:62px}.canvas.plc-open .sheets{bottom:calc(min(380px,62%) + 62px)}}
/* en móvil el panel de estado flota sobre la hoja: el zoom y las hojas suben para no quedar debajo */
@media (max-width:900px){.app:not(.noinsp) .zoom{bottom:62px}.app:not(.noinsp) .sheets{bottom:62px}}
@media (max-width:760px){.app:not(.noinsp) .sheets{bottom:112px}}
.plcd header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.plcd h2{margin:0;font:700 19px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.plcd .pio{display:flex;gap:3px;flex-wrap:wrap;margin-right:auto;min-width:0}
.plcd .pio span{font:600 10.5px/1 var(--f-mono);padding:4px 5px;border-radius:5px;background:var(--chip-off);color:var(--chip-off-t)}
.plcd .pio span.on{background:var(--chip-on);color:var(--chip-on-t)}
.plcd .pio i{width:8px}
.plcd .pst{font:600 11px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--chip-off);color:var(--chip-off-t)}
.plcd .pst.on{background:var(--chip-on);color:var(--chip-on-t)} .plcd .pst.al{background:var(--chip-al);color:var(--chip-al-t)}
.plcd .pbody{overflow:auto;padding:8px 10px 14px;flex:1;min-height:0}
.plcd .pnote{margin:2px 4px 10px;font-size:12.5px;color:var(--muted)}
.rung{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;padding:8px 6px;border-bottom:1px solid var(--line2)}
.rung .rh b{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rung .rx{margin:5px 0 6px;font:500 12px/1.35 var(--f-mono);color:var(--text);word-break:break-word}
.rung .rx .ov{text-decoration:overline}
.rung .rw{font-size:11.5px;color:var(--warn);margin:0 0 6px}
.rung .ra{display:flex;gap:3px}
.rung .ra button{width:26px;height:24px;border:1px solid var(--line);background:var(--raise);border-radius:6px;cursor:pointer;font-size:13px;line-height:1;color:var(--muted)}
.rung .ra button:hover{color:var(--text);border-color:var(--faint)}
.rung .ra button:disabled{opacity:.35;cursor:default}
.rung svg{display:block;max-width:none;background:var(--sheet);border-radius:8px}
.rsc{overflow-x:auto;min-width:0}
.ld line,.ld path,.ld rect,.ld circle{stroke:#33413D;stroke-width:2;fill:none;stroke-linecap:round}
.ld .pw{stroke:#1E9A4C;stroke-width:3}
.ld .cbg{fill:transparent;stroke:none}
.ld .cbg.cl{fill:rgba(47,191,91,.16)}
.ld .rail{stroke-width:3}
.ld text{font:600 11.5px var(--f-mono);fill:#1A2724;stroke:none}
.ld .sm{font:500 10px var(--f-mono);fill:#4A5754}
.ld .k{cursor:pointer}
.ld .k:hover .cbg{fill:rgba(42,98,214,.12)}
.ld .k.on .cbg{fill:rgba(255,213,74,.55)}
.ld .add{cursor:pointer}
.ld .add circle{fill:#fff;stroke:#86918D;stroke-width:1.4;stroke-dasharray:3 2}
.ld .add text{fill:#56635F;font:600 13px var(--f-ui)}
.ld .add:hover circle{stroke:var(--sel);stroke-dasharray:none}
.plg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:0 8px 8px}
.plg button{height:28px;border:1px solid var(--line);background:var(--raise);border-radius:6px;cursor:pointer;font:600 11px var(--f-mono)}
.plg button.on{border-color:var(--sel);background:var(--selfill)}
.plg b{grid-column:1/-1;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.menu .fld{margin:2px 10px 8px}
@media (max-width:760px){.rung{grid-template-columns:minmax(0,1fr)}.plcd{height:min(380px,62%)}.canvas.plc-open .zoom{bottom:calc(min(380px,62%) + 12px)}}
.wbad{fill:none;stroke:#E3382B;stroke-width:12;opacity:.28;stroke-linecap:round;stroke-linejoin:round}
.cpk{display:grid;gap:1px;padding:0 2px}
.cpk .mi{padding:6px 10px}
.cpk .mi.sug{background:var(--selfill);box-shadow:inset 0 0 0 1px var(--sel)}
.cpk .mi em{font-style:normal;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sel);margin-left:6px}
.dot{width:22px;height:22px;border-radius:50%;display:block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* El panel de la derecha solo aparece con algo seleccionado o al simular */
/* solo en escritorio: en el móvil esta regla pisaba la maqueta de una columna y dejaba la hoja en 140 px */
@media (min-width:901px){.app.noinsp{grid-template-columns:232px minmax(0,1fr) 0}}
.app.noinsp .insp{display:none}
/* Archivo, como en Word: tarjetas de exportar y formulario de propiedades */
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.xcard{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:14px;cursor:pointer;color:var(--text)}
.xcard:hover{border-color:var(--sel);box-shadow:0 0 0 3px var(--selfill)}
.xcard .xi{width:46px;height:54px;border-radius:6px;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font:700 11px var(--f-mono);color:#14201D;position:relative;border:1px solid var(--line)}
.xcard .xi::before{content:"";position:absolute;top:9px;left:9px;right:9px;height:2px;background:#14201D;box-shadow:0 6px 0 #14201D,0 12px 0 rgba(20,32,29,.4)}
.xcard b{display:block;font-size:14px}
.xcard small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hform{max-width:560px;margin-top:18px}
.ubtn{display:flex;align-items:center;gap:8px}
.ubtn .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 11px/24px var(--f-ui);text-align:center;flex:none}
.ubtn.out .av{background:var(--chrome);color:var(--muted)}
.acc{max-width:460px;margin-top:18px;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px}
.acc .seg{margin-bottom:16px}
.acc .fld input{height:38px}
.acc .acts{margin:4px 0 12px}
.acc h4{margin:18px 0 8px}
.acc hr{border:0;border-top:1px solid var(--line);margin:16px 0 4px}
.amsg{border-radius:9px;padding:10px 12px;font-size:13px;margin:0 0 14px;line-height:1.45}
.amsg.ok{background:var(--chip-on);color:var(--chip-on-t)}
.amsg.err{background:var(--chip-al);color:var(--chip-al-t)}
.amsg.info{background:var(--chip-w);color:var(--chip-w-t)}
.alink{border:0;background:none;padding:0;color:var(--sel);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.who .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 18px/44px var(--f-ui);text-align:center}
.who b{display:block;font-size:16px}
.who small{color:var(--muted)}
.hnav.sep{margin-top:10px}

/* Barra de herramientas en pantallas de portátil: a 1280 px no cabía y Simular quedaba fuera de la pantalla.
   Se recorta por orden de importancia: primero el subtítulo y el nombre (el logo se queda), luego el atajo
   del buscador y por último los rótulos de las herramientas (el icono y el título emergente siguen ahí).
   Simular va pegado al borde derecho como red de seguridad: nunca puede quedar escondido. */
.run{position:sticky;right:0}
@media (max-width:1560px) and (min-width:901px){.brand span{display:none}}
@media (max-width:1500px) and (min-width:901px){.rvb .lbl{display:none}.brand div{display:none}.find{width:180px}.find kbd{display:none}}
@media (max-width:1400px) and (min-width:901px){.bar{gap:6px;padding-inline:12px}.grp{padding-left:7px}.find{width:150px}}
@media (max-width:1240px) and (min-width:901px){.bar [data-tool] .lbl,#t-wire3 .lbl,#b-file .lbl{display:none}.bar [data-tool],#t-wire3,#b-file{padding:0 9px}.find{width:44px;padding:0;justify-content:center}.find .lbl{display:none}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) 96px;grid-template-areas:"bar" "stage" "pal"}
  .bar{padding-inline:12px;gap:8px}
  .brand div{display:none}
  .bar .btn .lbl{display:none}
  .bar .btn{width:34px;padding:0;justify-content:center}
  .find kbd{display:none}
  .grp{padding-left:6px}
  .sp{display:none}
  .run{order:-1;height:34px;padding:0 14px 0 10px;font-size:15px}
  .brand{order:-2}
  .tabs .sst{display:none}
  .pal{border-right:0;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px)) 8px;overflow-x:auto;overflow-y:hidden;display:flex;gap:4px}
  #pal-list{display:contents}
  .search,.pc h3{display:none}
  .pc,.pgrid,.pc.closed .pgrid,#pal-rec{display:contents}
  .pc.rec{display:none}
  .it{flex:0 0 84px}
  .insp{position:fixed;left:8px;right:8px;bottom:calc(104px + env(safe-area-inset-bottom,0px));max-height:44px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;transition:max-height .22s ease;overflow:hidden;display:flex;flex-direction:column}
  .insp.open{max-height:46vh}
  .insp-tog{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;border:0;background:none;padding:0 14px;font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;flex:none;border-bottom:1px solid var(--line2)}
  .insp.open .insp-tog span:last-child{transform:rotate(180deg)}
  #ib{overflow-y:auto;padding-top:12px}
  .hint{display:none}
  .toast{bottom:16px}
  .files li{grid-template-columns:1fr}
  .home{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .hrail{flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;gap:4px}
  .hbrand{padding:0 6px 0 0} .hbrand b{display:none}
  .hsp,.hcloud{display:none}
  .hnav{height:36px;padding:0 10px}
  .hnav.on::before{display:none}
  .hmain{padding-top:24px}
  .hmain h1{font-size:28px}
  .tpls{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .frow{grid-template-columns:48px minmax(0,1fr) auto}
  .fth{width:48px;height:38px}
  .fdt,.fct{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.probe{position:absolute;right:12px;top:12px;z-index:4;display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;max-width:min(300px,calc(100% - 24px))}
.probe[hidden]{display:none}
.probe b{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.probe small{color:var(--muted);display:block;font-size:11px}
.probe .px{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px}
.probe .px:hover{background:var(--chrome);color:var(--text)}
.live.probing .legend{max-width:calc(100% - 328px)}
.prb-ring{fill:none;stroke:var(--sel);stroke-width:2.2}
.prb-ref{fill:rgba(242,183,5,.24);stroke:#B98C00;stroke-width:2.2}
.pdiag{margin:4px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:6px 8px}
.pdiag svg{width:100%;height:auto;display:block}
.pio span small{font-size:9.5px;opacity:.78;margin-left:3px;font-weight:500}
</style>
</head>
<body>

<div class="app tool-select" id="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#1A2724"/><path d="M9.6 22H13c3.2 0 3-12 6.2-12h3.2" fill="none" stroke="#F2B705" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="22" r="2.7" fill="#F2B705"/><circle cx="25" cy="10" r="2.7" fill="#F2B705"/></svg>
      <div><b>Kableo</b><span>Esquemas de mando y potencia</span></div>
    </div>
    <div class="grp">
      <button class="btn pri" id="b-file" title="Archivo: nuevo, abrir, guardar, exportar, propiedades y ayuda"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">Archivo</span></button>
    </div>
    <div class="grp">
      <button class="btn on" id="t-select" data-tool="select" title="Mover: arrastrar desplaza el plano y un clic elige un componente (V)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="lbl">Mover</span></button>
      <button class="btn" id="t-box" data-tool="box" title="Selección: arrastrar marca varios componentes con un recuadro (B)"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke-dasharray="3 3"/></svg><span class="lbl">Selección</span></button>
      <button class="btn" id="t-wire" data-tool="wire" title="Dibujar cable (W)"><svg viewBox="0 0 24 24"><path d="M4 18h6V6h10"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="6" r="1.6"/></svg><span class="lbl">Cable</span></button>
      <button class="btn" id="t-wire3" title="Tirar varios cables a la vez. Otro clic cambia el número (teclas 2 a 5)"><svg viewBox="0 0 24 24"><path d="M3 6h9v12h9M3 10h5v12h13M3 2h13v12h5" transform="translate(0 0)"/></svg><span class="lbl">3 cables</span></button>
      <button class="btn" id="t-text" data-tool="text" title="Escribir texto en el plano (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span class="lbl">Texto</span></button>
      <button class="btn wsw" id="b-wst" title="Color y grosor del cable" aria-label="Color y grosor del cable"><i id="wst-i"></i></button>
    </div>
    <div class="grp">
      <button class="btn ib" id="b-rot" title="Girar 90° (R)" aria-label="Girar 90 grados"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <button class="btn ib" id="b-del" title="Eliminar (Supr)" aria-label="Eliminar"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button class="btn ib" id="b-undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn ib" id="b-redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn find" id="b-find" title="Buscar un componente para añadirlo (Ctrl+K)"><span style="display:inline-flex;gap:7px;align-items:center"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="lbl">Buscar componente…</span></span><kbd>Ctrl K</kbd></button>
    </div>
    <div class="sp"></div>
    <button class="btn ubtn out" id="b-user" hidden title="Tu cuenta"><span class="av">?</span><span class="lbl">Entrar</span></button>
    <select class="btn" id="b-lang" aria-label="Idioma" title="Idioma / Hizkuntza / Llengua / Idioma / Language / Langue"></select>
    <button class="btn rvb" id="b-chk" title="Revisar el plano: bornes al aire, contactos sin bobina, cortocircuitos y colores de cable"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span class="lbl">Revisar</span><b class="bdg" id="chk-n" hidden></b></button>
    <button class="btn ib" id="b-help" title="Ayuda y atajos" aria-label="Ayuda y atajos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14"/><path d="M12 17.2v.3"/></svg></button>
    <button class="run" id="b-run" title="Simular (S)"><i></i><span id="run-t">Simular</span></button>
  </header>

  <aside class="pal" id="pal" aria-label="Componentes">
    <input class="search" id="q" type="search" placeholder="Buscar: luz, botón, motor…" autocomplete="off" aria-label="Filtrar componentes">
    <div id="pal-list"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="tabs" id="tabs" role="tablist" aria-label="Planos abiertos"></div>
    <div class="canvas" id="canvas">
      <svg id="sv" aria-label="Hoja de esquema">
        <defs><pattern id="gp" width="100" height="100" patternUnits="userSpaceOnUse"></pattern></defs>
        <rect x="0" y="0" width="100%" height="100%" fill="url(#gp)"/>
        <g id="world"></g>
        <g id="probe-g"></g>
      </svg>
      <div class="probe" id="probe" hidden></div>
      <div class="legend" id="legend" hidden>
        <span><i style="background:var(--l1)"></i>L1 marrón</span><span><i style="background:var(--l2)"></i>L2 negro</span><span><i style="background:var(--l3)"></i>L3 gris</span><span><i style="background:var(--n)"></i>N / 0 V azul</span><span><i style="background:repeating-linear-gradient(90deg,var(--pe) 0 6px,#E9C81C 6px 10px)"></i>PE</span><span><i style="background:var(--dc)"></i>+24 V</span><span><i style="background:var(--sec)"></i>secundario</span><span><i style="background:#0E8FB3"></i>aire a presión</span><span><i style="background:var(--inkdim)"></i>sin tensión</span>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="hint" id="hint"></div>
      <div class="zoom">
        <button id="z-out" title="Alejar" aria-label="Alejar">−</button><span id="z-val">100%</span><button id="z-in" title="Acercar" aria-label="Acercar">+</button><button id="z-fit" title="Ajustar el plano a la ventana (F)">Ajustar</button>
      </div>

      <section class="plcd" id="plcd" hidden aria-label="Programa del PLC"></section>      <nav class="sheets" id="sheets" aria-label="Hojas del plano"></nav>
      <div class="toast" id="toast" hidden></div>
    </div>
  </main>

  <aside class="insp" id="insp" aria-label="Propiedades">
    <button class="insp-tog" id="insp-tog"><span id="insp-tt">Propiedades</span><span aria-hidden="true">▴</span></button>
    <div id="ib"></div>
  </aside>
</div>

<div class="menu" id="menu" hidden></div>

<div class="home" id="home" hidden>
  <nav class="hrail" aria-label="Inicio">
    <div class="hbrand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#F2B705"/><path d="M9.6 22H13c3.2 0 3-12 6.2-12h3.2" fill="none" stroke="#14201D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="22" r="2.7" fill="#14201D"/><circle cx="25" cy="10" r="2.7" fill="#14201D"/></svg>
      <b>Kableo</b>
    </div>
    <button class="hnav" data-hs="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button class="hnav" data-hs="nuevo"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></svg>Nuevo</button>
    <button class="hnav" data-hs="abrir"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Abrir</button>
    <button class="hnav sep" data-hact="saveas"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="M9 17h6M12 14v6"/></svg>Guardar como</button>
    <button class="hnav" data-hact="json"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Descargar una copia</button>
    <button class="hnav" data-hact="print"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><path d="M7 17H4v-7h16v7h-3"/><path d="M7 14h10v7H7z"/></svg>Imprimir</button>
    <button class="hnav" data-hs="exportar"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Exportar</button>
    <button class="hnav" data-hs="propiedades"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 14h16M12 14v6"/></svg>Propiedades</button>
    <button class="hnav" data-hs="ayuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14"/><path d="M12 17.2v.3"/></svg>Ayuda</button>
    <button class="hnav" data-hs="cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Cuenta</button>
    <div class="hsp"></div>
    <div class="hcloud"><span class="sst" data-sst></span><button class="btn sm" id="h-cloud">Guardar también en mi cuenta</button></div>
    <button class="hnav" id="h-back"><svg viewBox="0 0 24 24"><path d="M10 6l-6 6 6 6"/><path d="M4 12h16"/></svg>Volver al plano</button>
  </nav>
  <main class="hmain" id="hmain"></main>
  <input type="file" id="h-file" accept=".json,application/json" hidden>
</div>

<div class="modal top" id="cmd" hidden>
  <div class="dlg cmd" role="dialog" aria-modal="true" aria-label="Buscar">
    <div class="qwrap"><input class="q" id="cmd-q" type="search" placeholder="¿Qué quiere poner? Escriba «luz», «botón de paro», «motor»…" autocomplete="off" aria-label="Buscar"></div>
    <div class="res" id="cmd-l" role="listbox"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const G = 20, VPH = 230;
const $ = s => document.querySelector(s);
const hx = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
const fmtS = v => String(Math.round((+v || 0) * 10) / 10).replace('.', ',');
const plain = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const today = () => new Date().toLocaleDateString('es-ES');
const ts = x => (window.I18N && I18N.t) ? I18N.t(x) : x;

/* ---------- números complejos (fasores de 50 Hz) ---------- */
const cx = (re, im) => ({re, im: im || 0}), ZERO = cx(0, 0);
const csub = (a, b) => cx(a.re - b.re, a.im - b.im);
const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cabs = a => Math.hypot(a.re, a.im);
const pol = (m, d) => cx(m * Math.cos(d * Math.PI / 180), m * Math.sin(d * Math.PI / 180));
const OP_A = pol(1, 120), OP_A2 = pol(1, 240);
/* Cada borne de alimentación: clave (dos claves distintas en el mismo nudo = cortocircuito), fasor y color. */
const SRC = {
  L1: {k: 'L1', v: pol(VPH, 0), cls: 'l1', nm: 'L1'},
  L2: {k: 'L2', v: pol(VPH, -120), cls: 'l2', nm: 'L2'},
  L3: {k: 'L3', v: pol(VPH, 120), cls: 'l3', nm: 'L3'},
  N: {k: 'N', v: ZERO, cls: 'n', nm: 'N'},
  PE: {k: 'N', v: ZERO, cls: 'pe', nm: 'PE'},
  P24: {k: 'P24', v: cx(24, 0), cls: 'dc', nm: '+24 V'},

/* ---------- primitivas SVG ---------- */
const ln = (a, b, c, d, k) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"${k ? ` class="${k}"` : ''}/>`;
const pa = (d, k) => `<path d="${d}"${k ? ` class="${k}"` : ''}/>`;
const rc = (x, y, w, h, k, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${r ? ` rx="${r}"` : ''}${k ? ` class="${k}"` : ''}/>`;
const ci = (x, y, r, k) => `<circle cx="${x}" cy="${y}" r="${r}"${k ? ` class="${k}"` : ''}/>`;
const pathD = pts => 'M' + pts.map(p => p[0] * G + ' ' + p[1] * G).join('L');

function rot(x, y, r) {
  switch (((r || 0) % 360 + 360) % 360) {
    case 90: return [-y, x];
    case 180: return [-x, -y];
    case 270: return [y, -x];
    default: return [x, y];
  }
}

/* Contacto vertical: borne fijo arriba (y=-40) y móvil abajo (y=40). Cierra entre y=-12 e y=12. */
function blade(no, cl) {
  let s = ln(0, -40, 0, -12) + ln(0, 12, 0, 40);
  if (no) s += cl ? ln(0, 12, -2, -12) : ln(0, 12, -12, -9);
  else s += ln(0, -12, 10, -12) + (cl ? ln(0, 12, 12, -15) : ln(0, 12, -8, -9));
  return s;
}
function bmid(no, cl) { return no ? (cl ? [-1, 0] : [-6, 1.5]) : (cl ? [6, -1.5] : [-4, 1.5]); }
const DIAMOND = 'M-24 -7L-17 0L-24 7L-31 0Z';
function actuator(kind, m, pushed) {
  const d = pushed ? 5 : 0, link = x => ln(x, 0, m[0], m[1], 'dash');
  switch (kind) {
    case 'push': return ln(-18 + d, 0, m[0], m[1], 'dash') + pa(`M${-12 + d} -7H${-18 + d}V7H${-12 + d}`);
    case 'toggle': return link(-20) + pa('M-20 8V-8H-14');
    case 'smoke': return link(-18) + rc(-33, -8, 15, 16) + pa('M-29 5Q-32 2 -29 -1Q-27 -4 -29 -6M-23 5Q-26 2 -23 -1Q-21 -4 -23 -6');
    case 'drop': return link(-18) + rc(-33, -8, 15, 16) + pa('M-25.5 -6Q-20.5 0 -20.5 2.5A5 5 0 0 1 -30.5 2.5Q-30.5 0 -25.5 -6Z');
    case 'limit': return link(-18) + ci(-23, 0, 5);
    case 'emerg': return link(-18) + pa('M-18 -9V9') + pa('M-18 -10A10 10 0 0 0 -18 10', 'mush');
    case 'prox': return link(-17) + pa(DIAMOND) + ln(-27, 3, -21, -3);
    case 'photo': return link(-17) + pa(DIAMOND) + pa('M-42 -10L-34 -5M-37 -5H-34V-8M-42 -1L-34 4M-37 4H-34V1');
    case 'box': return link(-18) + rc(-33, -8, 15, 16);
    case 'cap': return link(-17) + pa(DIAMOND) + ln(-26, -3, -26, 3) + ln(-22, -3, -22, 3);
    case 'clock': return link(-17) + ci(-24, 0, 7) + pa('M-24 -4V0H-21');
    case 'level': return link(-18) + ln(-32, 8, -16, 8) + ci(-24, 2, 4);
    case 'ton': return ln(-12, 0, m[0], m[1], 'dash') + pa('M-12 -7A7 7 0 0 0 -12 7');
    case 'toff': return ln(-13, 0, m[0], m[1], 'dash') + pa('M-20 -7A7 7 0 0 1 -20 7');
    case 'thermal': return link(-20) + pa('M-28 5V-4H-21V5');
  }
  return '';
}

const restOf = (c, t) => { t = t || T[c.type]; return t.inv ? !!(c.p && c.p.nc) : !!t.rest; };
const numsOf = (c, t) => { t = t || T[c.type]; return t.inv && c.p && c.p.nc ? ['11', '12'] : t.nums; };

function C2(o) {

    kind: 'sw', pins: [[0, -2], [0, 2]], box: [-36, -42, 16, 42],

      if (a) s += actuator(a, bmid(no, st.closed), st.pushed);

}
function polesN(xs, st, mark) {

function coilDraw(st, timer) {

  if (timer === 'on') s += rc(-18, -11, 11, 22) + ln(-18, -11, -7, 11) + ln(-7, -11, -18, 11);
  if (timer === 'off') s += rc(-18, -11, 11, 22, 'fill');

  if (timer === 'tele') s += rc(-18, -11, 11, 22) + pa('M-16 5V-4H-12.5V5H-9V-4');
  if (st.prog != null) s += rc(-3, 4, 17, 3, 'trk') + rc(-3, 4, Math.max(0.6, 17 * st.prog).toFixed(1), 3, 'prg');
  return s;
}
const unLabel = c => (+c.p.Un || 230) === 230 ? '' : (+c.p.Un) + ' V';
function COIL(o) {

    kind: 'load', role: 'coil', R: 2000, pins: [[0, -2], [0, 2]], box: [-22, -42, 22, 42], hasUn: true,

}
function motTop() { return ln(-40, -40, -40, -26) + ln(-40, -26, -18, -5) + ln(0, -40, 0, -12) + ln(40, -40, 40, -26) + ln(40, -26, 18, -5); }
function motBot() { return ln(-40, 60, -40, 48) + ln(-40, 48, -18, 33) + ln(0, 60, 0, 40) + ln(40, 60, 40, 48) + ln(40, 48, 18, 33); }

/* ---- Aparatos de varios polos (2 o 4) ---- */
function PN(o) {
  const xs = o.xs, n = xs.length;
  return reg(Object.assign({
    kind: 'sw3', drive: 'self', prefix: 'Q', pins: xs.map(x => [x / 20, -2]).concat(xs.map(x => [x / 20, 2])), poles: xs.map((_, i) => [i, i + n]),
    labels(c, st) {
      const L = [{x: this.tagx, y: 0, t: c.tag, cls: 'tg'}];
      xs.forEach((x, i) => L.push({x: x + 6, y: -31, t: this.nums[i], cls: 'tn'}, {x: x + 6, y: 31, t: this.nums[i + n], cls: 'tn'}));
      if (this.more) L.push(...this.more(c, st));
      if (st.state) L.push({x: this.tagx, y: 30, t: st.state, cls: 'st ' + st.k, a: 'end'});
      return L;
    }
  }, o));
}

function dbl(no0, no1, cl, act, pushed) {
  const m0 = bmid(no0, cl[0]), m1 = bmid(no1, cl[1]);
  return `<g transform="translate(-20 0)">${blade(no0, cl[0])}${actuator(act, m0, pushed)}</g><g transform="translate(20 0)">${blade(no1, cl[1])}</g>` + ln(-20 + m0[0], m0[1], 20 + m1[0], m1[1], 'dash');
}

/* ---- Electrónica ----
   Los semiconductores se resuelven por tramos: cada diodo conduce o bloquea según su tensión en continua,
   y el circuito se recalcula hasta que todos los estados son coherentes. */

const fmtOhm = r => r >= 1000 ? fmtS(r / 1000) + ' kΩ' : r + ' Ω';
const fmtI = i => i >= 1 ? fmt1(i) + ' A' : Math.round(i * 1000) + ' mA';
function dioSym(st, on) { return ln(0, -40, 0, -9) + ln(0, 9, 0, 40) + pa('M-11 -9H11L0 9Z', on ? 'dfill' : '') + ln(-11, 9, 11, 9, st.burnt ? 'burnt' : ''); }

/* ---- Motores, variadores y arrancadores ---- */
function VFD(o) {
  const n = o.nin, X0 = n === 3 ? [-2, 0, 2] : [-1, 1];
  return reg(Object.assign({kind: 'vfd', prefix: 'U', cat: 'Motores y variadores', defaults: {f1: 50, f2: 25, ramp: 3},
    pins: X0.map(x => [x, -3]).concat([[-2, 3], [0, 3], [2, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3]]), box: [-100, -62, 176, 62],
    draw(c, st) {
      let s = rc(-56, -44, 228, 88, '', 4) + X0.map(x => ln(x * 20, -60, x * 20, -44)).join('') + [-40, 0, 40, 80, 100, 120, 140, 160].map(x => ln(x, 60, x, 44)).join('');
      s += rc(-30, -26, 60, 40) + ln(-30, 14, 30, -26) + rc(56, -34, 110, 30, 'disp', 3);
      if (st.live && st.pow) s += rc(56, 2, 110 * clamp(st.f / 100, 0, 1), 4, 'prg');
      return s;
    },
    labels(c, st) {
      const L = [{x: -60, y: 0, t: c.tag, cls: 'tg', a: 'end'}, {x: -16, y: -14, t: '~', cls: 'pl', a: 'middle'}, {x: 16, y: 2, t: 'f', cls: 'pl', a: 'middle'}];
      (n === 3 ? ['L1', 'L2', 'L3'] : ['L', 'N']).forEach((t, i) => L.push({x: X0[i] * 20, y: -34, t, cls: 'tn', a: 'middle'}));
      ['U', 'V', 'W', '+24', 'DI1', 'DI2', 'DI3', 'COM'].forEach((t, i) => L.push({x: [-40, 0, 40, 80, 100, 120, 140, 160][i], y: 34, t, cls: 'tn', a: 'middle'}));
      const f = st.live ? (st.pow ? fmt1(st.f) + ' Hz ' + (st.f > 0.3 ? (st.dir > 0 ? '▶' : '◀') : '■') : ts('SIN TENSIÓN')) : fmtS(c.p.f1) + ' Hz';
      L.push({x: 111, y: -19, t: f, cls: 'pl', a: 'middle'});
      if (!st.live) L.push({x: 111, y: 14, t: ts('rampa') + ' ' + fmtS(c.p.ramp) + ' s', cls: 'tn', a: 'middle'});
      return L;
    }
  }, o));
}

/* ---------- pestañas y almacenamiento ---------- */
const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (_) {} };
/* Copia en este navegador siempre; además, en la cuenta del usuario cuando el visor lo permite (capacidad db, carpeta privada). */
/* Cada usuario tiene su propio espacio en este navegador: así, en un ordenador compartido nadie ve los planos de otro */
const K = s => (Store.ns ? 'banco:u:' + Store.ns + ':' : 'banco:') + s;
const Store = {
  col: null, ns: '',
  idx() { try { const v = JSON.parse(lsGet(K('indice')) || '[]'); return Array.isArray(v) ? v : []; } catch (_) { return []; } },
  getLocal(id) { try { return JSON.parse(lsGet(K('f:' + id)) || 'null'); } catch (_) { return null; } },
  putLocal(rec) {
    const ok = lsSet(K('f:' + rec.id), JSON.stringify(rec));
    const a = this.idx().filter(x => x.id !== rec.id); a.unshift({id: rec.id, name: rec.name, updated: rec.updated, n: bookCount(rec.doc)});
    lsSet(K('indice'), JSON.stringify(a.slice(0, 300)));
    return ok;
  },
  async put(rec) {
    const ok = this.putLocal(rec);
    if (this.col) {
      try { await this.col.doc(rec.id).set({name: rec.name, updated: rec.updated, n: bookCount(rec.doc), meta: rec.meta || {}, doc: JSON.stringify(rec.doc)}); return 'cloud'; }
      catch (e) { if (e && e.code === 'quota_exceeded') toast('El espacio de tu cuenta está lleno: el plano se ha guardado solo en este navegador', 'err'); }
    }
    return ok ? 'local' : 'fail';
  },
  async list() {
    const m = new Map(this.idx().map(x => [x.id, Object.assign({where: 'local'}, x)]));
    if (this.col) {
      try {
        const qs = await this.col.get();
        for (const d of qs.docs) { const v = d.data() || {}, o = m.get(d.id); if (!o || (v.updated || 0) > o.updated) m.set(d.id, {id: d.id, name: v.name, updated: v.updated || 0, n: v.n || 0, where: o ? 'both' : 'cloud'}); else o.where = 'both'; }
      } catch (_) {}
    }
    return [...m.values()].sort((a, b) => b.updated - a.updated);
  },
  async get(id) {
    let loc = this.getLocal(id);
    if (this.col) {
      try {
        const s = await this.col.doc(id).get();
        if (s.exists) { const v = s.data(); if (!loc || v.updated > loc.updated) { loc = {id, name: v.name, updated: v.updated, meta: v.meta || {}, doc: JSON.parse(v.doc)}; this.putLocal(loc); } }
      } catch (_) {}
    }
    return loc;
  },
  async remove(id) {

/* ---------- inicio (como la pantalla de entrada de Word) ---------- */
const homeEl = $('#home'), hmain = $('#hmain');
let homeSec = 'inicio', homeQ = '';
const pvCache = new Map();
/* Miniatura de un plano: se dibuja con el mismo motor que la hoja, cambiando el plano un momento. */
function previewSVG(get, key) {
  if (key && pvCache.has(key)) return pvCache.get(key);
  const sd = doc, sg = GEO, ss = selection, so = sim.on;
  let svg = '';
  try {
    doc = normBook(get()).sheets[0]; selection = new Set(); sim.on = false; GEO = geo();
    const b = bounds();
    svg = b ? `<svg viewBox="${b[0] - 24} ${b[1] - 24} ${b[2] - b[0] + 48} ${b[3] - b[1] + 48}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${sceneParts(false).join('')}</svg>` : '';
  } catch (_) { svg = ''; }
  finally { doc = sd; GEO = sg; selection = ss; sim.on = so; }
  if (key) pvCache.set(key, svg);
  return svg;
}
function fmtWhen(t) {
  const d = new Date(t || 0), n = new Date(), hm = d.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
  if (d.toDateString() === n.toDateString()) return 'Hoy, ' + hm;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Ayer, ' + hm;

  if (u && !u.emailVerified) { try { await u.reload(); u = FB.auth.currentUser; acct.user = u; if (u && u.emailVerified) await u.getIdToken(true); } catch (_) {} }
  if (u && u.emailVerified) {
    lsSet('banco:ultimo-usuario', u.uid);
    switchWorkspace(u.uid);
    const col = FB.db.collection('usuarios').doc(u.uid).collection('planos');
    try {
      const remote = new Map();
      (await col.get()).docs.forEach(d => remote.set(d.id, (d.data() || {}).updated || 0));
      Store.col = col;
      for (const f of Store.idx()) if ((remote.get(f.id) || 0) < f.updated) { const r = Store.getLocal(f.id); if (r) await Store.put(r); }
      setSst('cloud');
    } catch (e) { Store.col = null; toast(errTxt(e) + ' Los planos se guardan en este navegador.', 'err'); }
  } else {
    Store.col = null;
    if (!u) { lsDel('banco:ultimo-usuario'); switchWorkspace(''); }
    setSst('local');
  }
  updUser();
  if (!homeEl.hidden) { libCache = await Store.list(); renderHome(); }
}
async function accDo(kind, form) {
  if (!FB) return;

  const say = (k, t) => { acct.msg = {k, t}; renderHome(); };
  const btns = hmain.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  const u = FB.auth.currentUser;

    if (kind === 'login') {

      const rem = document.getElementById('acc-rem');
      await FB.auth.setPersistence(rem && !rem.checked ? firebase.auth.Auth.Persistence.SESSION : firebase.auth.Auth.Persistence.LOCAL);
      await FB.auth.signInWithEmailAndPassword(email, v('acc-pass'));

      if (!name) return say('err', 'Escribe tu nombre.');

      await cred.user.updateProfile({displayName: name});

      acct.mode = 'login';
      return say('ok', 'Si hay una cuenta con ese correo, te llegará un enlace para elegir una contraseña nueva. Mira también en el correo no deseado.');
    } else if (kind === 'resend' && u) { await u.sendEmailVerification({url: siteUrl()}); return say('ok', 'Correo reenviado a ' + u.email + '.'); }
    else if (kind === 'check' && u) {
      await u.reload(); const u2 = FB.auth.currentUser;
      if (!u2.emailVerified) return say('err', 'Todavía no consta como confirmado. Abre el enlace del correo y vuelve a pulsar.');
      await u2.getIdToken(true); acct.msg = {k: 'ok', t: 'Correo confirmado. ¡Bienvenido!'}; await onUser(u2); return;
    } else if (kind === 'logout') {
      const uid = u && u.uid;
      let synced = !!Store.col;
      for (const t of tabs) { clearTimeout(t._st); if ((await persist(t)) !== 'cloud') synced = false; }
      await FB.auth.signOut();
      /* en un ordenador compartido no deja rastro: si todo está en la nube, borra la copia local de ese usuario */
      if (uid && synced) { try { for (const k of Object.keys(localStorage)) if (k.startsWith('banco:u:' + uid + ':')) localStorage.removeItem(k); } catch (_) {} }
      acct.mode = 'login'; acct.msg = {k: 'ok', t: 'Sesión cerrada.'};
    } else if (kind === 'pass' && u) {
      const p1 = v('acc-new'), p2 = v('acc-new2');
      if (p1.length < 8) return say('err', 'La contraseña nueva tiene que tener al menos 8 caracteres.');
      if (p1 !== p2) return say('err', 'Las dos contraseñas nuevas no coinciden.');
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, v('acc-cur')));
      await u.updatePassword(p1);
      return say('ok', 'Contraseña cambiada.');
    } else if (kind === 'delete' && u) {
      if (v('acc-del').trim().toUpperCase() !== 'BORRAR') return say('err', 'Escribe BORRAR para confirmar.');
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, v('acc-delp')));
      const col = FB.db.collection('usuarios').doc(u.uid).collection('planos');
      for (const d of (await col.get()).docs) await col.doc(d.id).delete();
      const uid = u.uid;
      Store.col = null;
      await u.delete();
      try { for (const k of Object.keys(localStorage)) if (k.startsWith('banco:u:' + uid + ':')) localStorage.removeItem(k); } catch (_) {}
      acct.msg = {k: 'ok', t: 'Cuenta borrada.'};

      let n = 0;

    }
  } catch (e) { return say('err', errTxt(e)); }
  finally { hmain.querySelectorAll('button').forEach(b => b.disabled = false); }
  renderHome();
}

/* --- cableado: árbol mínimo por red, saliendo a la canaleta más cercana --- */
function route(M,L){ let hop=false;
  const out=[], len={}, lenBySect={}; let ni=0; const off=(i,sz)=>((i%9)-4)*sz/10, sx=[L.dw/2,L.W-L.dw/2];
  for(const [net,A] of L.att){
    if(A.length<2)continue; const cl=M.clsOf(net), sect=netSection(M,net,cl), sk=cl+'|'+sect, lane=ni++, done=[A[0]], rest=A.slice(1);
    while(rest.length){ let best=null; for(const b of rest)for(const a of done){ const d=Math.abs(a.x-b.x)+Math.abs(a.y-b.y); if(!best||d<best.d)best={d,a,b}; }
      rest.splice(rest.indexOf(best.b),1); done.push(best.b);
      const {a,b}=best;
      if(a.dk&&b.dk&&Math.abs(a.y-b.y)<3&&Math.abs(a.x-b.x)<30){ const l=Math.abs(a.x-b.x)+10; out.push({cl,sect,P:[[a.x,a.y],[b.x,b.y]],a:a.tag,b:b.tag}); len[cl]=(len[cl]||0)+l; lenBySect[sk]=(lenBySect[sk]||0)+l; continue; }
      let P;
      if(a.door&&b.door){ const hx0=L.doorX+10+off(lane,10); P=[[a.x,a.y],[hx0,a.y],[hx0,b.y],[b.x,b.y]]; }
      else if(a.door||b.door){
        const dr=a.door?a:b, pn=a.door?b:a, dp=pn.r+(pn.s==='b'?1:0), yp=L.ducts[dp].cy+off(lane,L.dw), rx=(cfg.side?L.W-L.dw/2:L.W-10)+off(lane,L.dw);
        P=a.door?[[dr.x,dr.y],[rx,dr.y],[rx,yp],[pn.x,yp],[pn.x,pn.y]]:[[pn.x,pn.y],[pn.x,yp],[rx,yp],[rx,dr.y],[dr.x,dr.y]];
      } else {
        const da=a.r+(a.s==='b'?1:0), db=b.r+(b.s==='b'?1:0), ya=L.ducts[da].cy+off(lane,L.dw), yb=L.ducts[db].cy+off(lane,L.dw);

        P.push([b.x,yb],[b.x,b.y]);

  return {wires:out,len,lenBySect};
}

Bobina de una electroválvula, en el circuito eléctrico de mando. Mueve el lado «Solenoide» de la válvula neumática que lleve su misma marca (o directamente un cilindro simplificado). | Solenoide-balbula baten bobina, agindu-zirkuitu elektrikoan. Bere marka bera duen balbula pneumatikoaren «Solenoide» aldea mugitzen du (edo zuzenean zilindro sinplifikatu bat). | Bobina d’una electrovàlvula, al circuit elèctric de comandament. Mou el costat «Solenoide» de la vàlvula pneumàtica amb la mateixa marca (o directament un cilindre simplificat). | Bobina dunha electroválvula, no circuíto eléctrico de mando. Move o lado «Solenoide» da válvula pneumática que leve a súa mesma marca (ou directamente un cilindro simplificado). | Coil of a solenoid valve, in the electrical control circuit. It moves the “Solenoid” side of the pneumatic valve with the same tag (or a simplified cylinder directly). | Bobine d’une électrovanne, dans le circuit électrique de commande. Elle actionne le côté « Solénoïde » du distributeur pneumatique de même repère (ou directement un vérin simplifié).

Sale mientras su electroválvula tiene tensión y vuelve al perderla (simple efecto). Con una segunda válvula pasa a doble efecto y solo vuelve cuando se activa la segunda. Acciona solo los finales de carrera de reposo (a0) y de fin de carrera (a1). | Bere solenoide-balbulak tentsioa duen bitartean ateratzen da eta tentsioa galtzean itzultzen da (efektu bakarra). Bigarren balbula batekin efektu bikoitzera pasatzen da eta bigarrena aktibatzean bakarrik itzultzen da. Atsedeneko (a0) eta ibilbide-amaierako (a1) mugako etengailuak bakarrik eragiten ditu. | Surt mentre la seva electrovàlvula té tensió i torna en perdre-la (simple efecte). Amb una segona vàlvula passa a doble efecte i només torna quan s’activa la segona. Només acciona els finals de carrera de repòs (a0) i de final de cursa (a1). | Sae mentres a súa electroválvula ten tensión e volve ao perdela (simple efecto). Cunha segunda válvula pasa a dobre efecto e só volve cando se activa a segunda. Só acciona os finais de carreira de repouso (a0) e de fin de carreira (a1). | Extends while its solenoid valve has voltage and returns when it loses it (single-acting). With a second valve it becomes double-acting and only returns when the second is energised. It only operates the rest (a0) and end-of-stroke (a1) limit switches. | Sort tant que son électrovanne est alimentée et rentre quand elle ne l’est plus (simple effet). Avec une seconde vanne il devient double effet et ne rentre que lorsque la seconde est activée. Il n’actionne que les fins de course de repos (a0) et de fin de course (a1).
Une puntos de hojas distintas: todos los conectores con el mismo nombre (su marca) son el mismo punto eléctrico. Al lado indica en qué hoja está su pareja; doble clic salta a ella. | Orri desberdinetako puntuak lotzen ditu: izen bera (marka) duten konektore guztiak puntu elektriko bera dira. Alboan bere bikotea zein orritan dagoen adierazten du; klik bikoitzak haraxe jauzi egiten du. | Uneix punts de fulls diferents: tots els connectors amb el mateix nom (la seva marca) són el mateix punt elèctric. Al costat indica en quin full és la seva parella; doble clic hi salta. | Une puntos de follas distintas: todos os conectores co mesmo nome (a súa marca) son o mesmo punto eléctrico. Ao lado indica en que folla está a súa parella; dobre clic salta a ela. | Joins points on different sheets: all connectors with the same name (their tag) are the same electrical point. Beside it shows which sheet its pair is on; double-click jumps to it. | Relie des points de feuilles différentes : tous les connecteurs de même nom (leur repère) forment le même point électrique. À côté figure la feuille de son pendant ; un double-clic y saute.

Una nota en el plano: títulos, aclaraciones o instrucciones. Doble clic para escribir en ella. | Planoko ohar bat: izenburuak, argibideak edo jarraibideak. Klik bikoitza bertan idazteko. | Una nota al plànol: títols, aclariments o instruccions. Doble clic per escriure-hi. | Unha nota no plano: títulos, aclaracións ou instrucións. Dobre clic para escribir nela. | A note on the drawing: titles, clarifications or instructions. Double-click to write in it. | Une note sur le plan : titres, précisions ou instructions. Double-clic pour y écrire.

Corta a la vez la fase y el neutro ante un cortocircuito. Es el PIA de una vivienda. Un clic lo abre o lo rearma. | Fasea eta neutroa batera mozten ditu zirkuitulabur baten aurrean. Etxebizitza bateko PIA da. Klik batek irekitzen edo berriro armatzen du. | Talla alhora la fase i el neutre davant d’un curtcircuit. És el PIA d’un habitatge. Un clic l’obre o el rearma. | Corta á vez a fase e o neutro ante un curtocircuíto. É o PIA dunha vivenda. Un clic ábreo ou réarmao. | Cuts phase and neutral together on a short circuit. It is the MCB of a home. A click opens or resets it. | Coupe à la fois la phase et le neutre en cas de court-circuit. C’est le disjoncteur d’un logement. Un clic l’ouvre ou le réarme.
